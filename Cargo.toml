[package]
name = "rtable"
version = "0.1.0"
edition = "2021"
description = "Табличный процессор на Rust: русские функции, файлы xlsx"

[dependencies]
eframe = "0.26"
egui_extras = "0.26"
calamine = "0.24"
rust_xlsxwriter = "0.64"

[target.'cfg(windows)'.dependencies]
rfd = "0.14"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
